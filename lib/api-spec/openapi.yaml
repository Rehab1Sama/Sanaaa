openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for مقرأة سَنا الآي Quran Center Management System
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: circles
    description: Quran circles management
  - name: students
    description: Student management
  - name: records
    description: Daily data entry records
  - name: stats
    description: Statistics and analytics
  - name: attendance
    description: Attendance tracking
  - name: registration
    description: Student registration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /auth/login/select:
    post:
      operationId: loginSelectAccount
      tags: [auth]
      summary: Select account after multi-role login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginSelectBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out successfully

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (archive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted

  /users/{id}/reset-password:
    patch:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user password (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset successfully

  /circles:
    get:
      operationId: listCircles
      tags: [circles]
      summary: List all circles
      parameters:
        - name: track
          in: query
          schema:
            type: string
        - name: isArchived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of circles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Circle"
    post:
      operationId: createCircle
      tags: [circles]
      summary: Create a new circle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCircleBody"
      responses:
        "201":
          description: Circle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"

  /circles/names:
    get:
      operationId: listCircleNames
      tags: [circles]
      summary: List all circle names (for transfer/selection, no data filtering)
      responses:
        "200":
          description: List of circle names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircleName"

  /circles/{id}:
    get:
      operationId: getCircle
      tags: [circles]
      summary: Get a circle with its members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Circle details with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleWithMembers"
    patch:
      operationId: updateCircle
      tags: [circles]
      summary: Update a circle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCircleBody"
      responses:
        "200":
          description: Circle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
    delete:
      operationId: deleteCircle
      tags: [circles]
      summary: Delete a circle (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Circle deleted

  /circles/{id}/teacher-absence:
    get:
      operationId: checkTeacherAbsence
      tags: [circles]
      summary: Check if teacher is absent for a circle on a given date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher absence status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAbsenceStatus"
    post:
      operationId: markTeacherAbsent
      tags: [circles]
      summary: Mark teacher as absent for a circle on a date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkTeacherAbsentBody"
      responses:
        "201":
          description: Teacher absence marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAbsenceStatus"
    delete:
      operationId: deleteTeacherAbsence
      tags: [circles]
      summary: Undo teacher absence for a circle on a date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher absence removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAbsenceStatus"

  /tracks/{id}/supervisor-names:
    get:
      operationId: listSupervisorNames
      tags: [tracks]
      summary: List supervisor names for a track
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of supervisor names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupervisorName"
    post:
      operationId: createSupervisorName
      tags: [tracks]
      summary: Add a supervisor name to a track (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupervisorNameBody"
      responses:
        "201":
          description: Supervisor name created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorName"

  /supervisor-names/{id}:
    delete:
      operationId: deleteSupervisorName
      tags: [tracks]
      summary: Delete a supervisor name (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /daily-circle-tasks:
    get:
      operationId: listDailyCircleTasks
      tags: [tasks]
      summary: List daily circle tasks (filtered by date and/or track)
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: supervisorNameId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daily tasks list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyCircleTask"
    post:
      operationId: saveDailyCircleTask
      tags: [tasks]
      summary: Save or update daily task data for a circle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDailyCircleTaskBody"
      responses:
        "201":
          description: Task saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCircleTask"

  /custom-questions:
    get:
      operationId: listCustomQuestions
      tags: [tasks]
      summary: List custom questions active for a date
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Custom questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomQuestion"
    post:
      operationId: createCustomQuestion
      tags: [tasks]
      summary: Create a custom question (leader only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomQuestionBody"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomQuestion"

  /custom-questions/{id}:
    delete:
      operationId: deleteCustomQuestion
      tags: [tasks]
      summary: Delete a custom question (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /custom-question-answers:
    post:
      operationId: saveCustomQuestionAnswer
      tags: [tasks]
      summary: Save answer to a custom question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCustomQuestionAnswerBody"
      responses:
        "201":
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomQuestionAnswer"

  /calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEventBody"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /calendar-events/{id}:
    patch:
      operationId: updateCalendarEvent
      tags: [calendar]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEventBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /store-products:
    get:
      operationId: listStoreProducts
      tags: [store]
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreProduct"
    post:
      operationId: createStoreProduct
      tags: [store]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreProductBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"

  /store-products/{id}:
    patch:
      operationId: updateStoreProduct
      tags: [store]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreProductBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
    delete:
      operationId: deleteStoreProduct
      tags: [store]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /exam-records:
    get:
      operationId: listExamRecords
      tags: [exams]
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Exam records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamRecord"
    post:
      operationId: createExamRecord
      tags: [exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamRecordBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamRecord"

  /exam-records/{id}:
    patch:
      operationId: updateExamRecord
      tags: [exams]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamRecordBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamRecord"
    delete:
      operationId: deleteExamRecord
      tags: [exams]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /volunteer/near-completion:
    get:
      operationId: listStudentsNearCompletion
      tags: [exams]
      summary: Students near completing a juz (for volunteer)
      responses:
        "200":
          description: Students near completion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentNearCompletion"

  /badge-events:
    get:
      operationId: listBadgeEvents
      tags: [badges]
      responses:
        "200":
          description: Badge events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeEvent"
    post:
      operationId: createBadgeEvent
      tags: [badges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBadgeEventBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeEvent"

  /badge-events/{id}/auto-assign:
    post:
      operationId: autoAssignBadgeEvent
      tags: [badges]
      summary: Auto-assign badge to all qualifying entities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auto-assigned result
          content:
            application/json:
              schema:
                type: object
                properties:
                  assigned:
                    type: integer
                  skipped:
                    type: integer
                  message:
                    type: string
                required: [assigned, skipped, message]

  /badge-events/{id}:
    patch:
      operationId: updateBadgeEvent
      tags: [badges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBadgeEventBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeEvent"
    delete:
      operationId: deleteBadgeEvent
      tags: [badges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /badge-assignments:
    get:
      operationId: listBadgeAssignments
      tags: [badges]
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: integer
        - name: badgeEventId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Badge assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeAssignment"
    post:
      operationId: createBadgeAssignment
      tags: [badges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBadgeAssignmentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeAssignment"

  /badge-assignments/{id}:
    delete:
      operationId: deleteBadgeAssignment
      tags: [badges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /exam-rotations:
    get:
      operationId: listExamRotations
      tags: [rotations]
      responses:
        "200":
          description: Exam rotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamRotation"
    post:
      operationId: createExamRotation
      tags: [rotations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamRotationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamRotation"

  /exam-rotations/{id}:
    delete:
      operationId: deleteExamRotation
      tags: [rotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateExamRotation
      tags: [rotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamRotationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamRotation"

  /exam-rotations/{id}/assignments:
    get:
      operationId: listExamAssignments
      tags: [rotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamTeacherAssignment"
    post:
      operationId: saveExamAssignments
      tags: [rotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    $ref: "#/components/schemas/ExamAssignmentInput"
              required: [assignments]
      responses:
        "201":
          description: Saved

  /teacher-absences:
    get:
      operationId: listTeacherAbsences
      tags: [circles]
      summary: List teacher absences (optionally filtered by date range)
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Teacher absence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherAbsenceRow"

  /tracks:
    get:
      operationId: listTracks
      tags: [tracks]
      summary: List all tracks
      responses:
        "200":
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
    post:
      operationId: createTrack
      tags: [tracks]
      summary: Create a new track (leader only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrackBody"
      responses:
        "201":
          description: Track created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"

  /tracks/{id}:
    patch:
      operationId: updateTrack
      tags: [tracks]
      summary: Update a track name (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrackBody"
      responses:
        "200":
          description: Track updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
    delete:
      operationId: deleteTrack
      tags: [tracks]
      summary: Delete a track (leader only, must be empty)
