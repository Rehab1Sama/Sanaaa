              $ref: "#/components/schemas/SaveCertificateGradesBody"
      responses:
        "200":
          description: Updated certificate results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificateStudentResult"

  /certificate-terms/{termId}/publish:
    post:
      operationId: publishCertificateTerm
      tags: [certificates]
      summary: Publish the final results for a term
      parameters:
        - $ref: "#/components/parameters/CertificateTermId"
      responses:
        "200":
          description: Published certificate term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateTerm"

  /certificate-terms/{termId}/my-result:
    get:
      operationId: getMyCertificateResult
      tags: [certificates]
      summary: Get the authenticated student's published result
      parameters:
        - $ref: "#/components/parameters/CertificateTermId"
      responses:
        "200":
          description: Published student result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStudentResult"
        "404":
          description: Result is not published or no linked student exists

  /certificate-terms/{termId}/import-candidates:
    get:
      operationId: listCertificateImportCandidates
      tags: [certificates]
      summary: List imported historical-score matches needing review
      parameters:
        - $ref: "#/components/parameters/CertificateTermId"
      responses:
        "200":
          description: Historical import candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificateImportCandidate"
    put:
      operationId: resolveCertificateImportCandidates
      tags: [certificates]
      summary: Confirm or dismiss historical-score matches
      parameters:
        - $ref: "#/components/parameters/CertificateTermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCertificateImportCandidatesBody"
      responses:
        "200":
          description: Import candidates updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificateImportCandidate"

