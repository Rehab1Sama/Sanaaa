kind = "web"
previewPath = "/"
title = "مقرأة سَنا الآي"
version = "1.0.0"
id = "artifacts/sana-quran"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18327

[services.development]
run = "pnpm --filter @workspace/sana-quran run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sana-quran", "run", "build" ]
publicDir = "artifacts/sana-quran/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18327"
BASE_PATH = "/"
