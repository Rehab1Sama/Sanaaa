name: Move Project to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move project from repo to root
        run: |
          set -e

          if [ ! -d "repo" ]; then
            echo "❌ مجلد repo غير موجود"
            exit 1
          fi

          echo "📦 نقل محتويات repo إلى جذر المستودع..."

          cp -a repo/. ./

          echo "🗑️ حذف مجلد repo..."
          rm -rf repo

          echo "📁 البنية النهائية:"
          find . -maxdepth 2 -type f | sort | head -100

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ لا توجد تغييرات"
            exit 0
          fi

          git commit -m "Move project to repository root"
          git push origin main
